name: Run Earnings History Backfill

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: "Deployment stage to run"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
      dry_run:
        description: "Fetch and summarize without writing DynamoDB"
        required: true
        default: true
        type: boolean
      max_tickers:
        description: "Maximum active tickers to process; 0 means all"
        required: true
        default: "10"
      offset:
        description: "Sorted active ticker offset for chunked runs"
        required: true
        default: "0"
      ticker_csv:
        description: "Optional comma-separated ticker subset"
        required: false
        default: ""
      yfinance_limit:
        description: "Maximum yfinance earnings rows per ticker"
        required: true
        default: "64"
      lookback_days:
        description: "Historical calendar window in days"
        required: true
        default: "1825"
      lookahead_days:
        description: "Upcoming calendar window in days"
        required: true
        default: "120"
      sleep_seconds:
        description: "Seconds to wait between ticker requests"
        required: true
        default: "1.5"
      publish_artifact:
        description: "Publish S3 audit artifact after non-dry run"
        required: true
        default: false
        type: boolean
      publish_after_backfill:
        description: "Run analyzer/publisher after a non-dry run"
        required: true
        default: false
        type: boolean

concurrency:
  group: run-earnings-history-backfill-${{ inputs.deployment_stage }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  run:
    name: Run manual earnings history backfill
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate inputs
        shell: bash
        run: |
          for value in "${{ inputs.max_tickers }}" "${{ inputs.offset }}" "${{ inputs.yfinance_limit }}" "${{ inputs.lookback_days }}" "${{ inputs.lookahead_days }}"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "Numeric inputs must be non-negative integers."
              exit 1
            fi
          done
          python - <<'PY'
          value = float("${{ inputs.sleep_seconds }}")
          if value < 0:
              raise SystemExit("sleep_seconds must be non-negative")
          PY

      - name: Check AWS OIDC role configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing GitHub secret AWS_ROLE_TO_ASSUME."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: stockara-earnings-backfill-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run earnings history backfill
        shell: bash
        env:
          STOCKARA_TABLE_NAME: stockara
          STOCKARA_ARTIFACT_BUCKET: ${{ vars.STOCKARA_ARTIFACT_BUCKET || '' }}
        run: |
          set -euo pipefail
          args=(
            --max-tickers "${{ inputs.max_tickers }}"
            --offset "${{ inputs.offset }}"
            --limit "${{ inputs.yfinance_limit }}"
            --lookback-days "${{ inputs.lookback_days }}"
            --lookahead-days "${{ inputs.lookahead_days }}"
            --sleep "${{ inputs.sleep_seconds }}"
          )
          if [[ -n "${{ inputs.ticker_csv }}" ]]; then
            args+=(--tickers "${{ inputs.ticker_csv }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ inputs.publish_artifact }}" == "true" ]]; then
            args+=(--publish-artifact)
          fi
          python -m scripts.backfill_earnings_calendar_history "${args[@]}"

      - name: Run analyzer publisher
        if: ${{ !inputs.dry_run && inputs.publish_after_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name stockara-phase1-analyzer-publisher \
            --payload '{}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            publisher-response.json > publisher-invoke.json
          python -c "import base64, json; meta=json.load(open('publisher-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('publisher-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat publisher-response.json
          python -m json.tool publisher-response.json
