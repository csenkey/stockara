name: Deploy Stockara

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment stage
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          if [[ "$branch" == "main" ]]; then
            stage="prod"
          else
            stage="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g' | cut -c1-24 | sed -E 's/^-|-$//g')"
            if [[ -z "$stage" ]]; then
              stage="feature"
            fi
          fi

          echo "DEPLOYMENT_STAGE=$stage" >> "$GITHUB_ENV"
          echo "Resolved deployment stage: $stage"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            infrastructure/requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install ruff

      - name: Lint Python
        run: ruff check backend infrastructure scripts

      - name: Run backend tests
        run: python -m pytest tests -q
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install CDK dependencies
        run: |
          python -m pip install -r infrastructure/requirements.txt
          python -m pip install pytest
          npm install -g aws-cdk

      - name: Run infrastructure tests
        run: python -m pytest tests -q
        working-directory: infrastructure

      - name: CDK synth
        run: cdk synth -c deploymentStage="$DEPLOYMENT_STAGE" -c region="$AWS_REGION"
        working-directory: infrastructure

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        run: |
          cdk deploy --all --require-approval never \
            --outputs-file cdk-outputs.json \
            -c deploymentStage="$DEPLOYMENT_STAGE" \
            -c region="$AWS_REGION"
        working-directory: infrastructure

      - name: Smoke test deployed API
        run: |
          api_url="$(python -c "import json; data=json.load(open('cdk-outputs.json')); print(next(outputs['ApiUrl'] for outputs in data.values() if 'ApiUrl' in outputs))")"
          curl --fail --silent --show-error "${api_url%/}/api/health"
        working-directory: infrastructure
