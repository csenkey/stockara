name: Run News Collection Now

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: "Deployment stage to run"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
      tickers_csv:
        description: "Optional comma-separated tickers to target"
        required: false
        default: ""
      provider_budget_json:
        description: "Optional provider budget JSON, e.g. {\"newsapi\":1,\"finnhub\":5}"
        required: false
        default: "{}"
      dry_run:
        description: "Build and validate the repair_news request without fetching or storing"
        required: true
        default: false
        type: boolean

concurrency:
  group: run-news-collection-now-${{ inputs.deployment_stage }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  collect:
    name: Invoke deployed news collector
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check AWS OIDC role configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing GitHub secret AWS_ROLE_TO_ASSUME."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: stockara-news-collection-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve function and bucket
        shell: bash
        run: |
          set -euo pipefail
          stage="${{ inputs.deployment_stage }}"
          if [[ "$stage" == "prod" ]]; then
            echo "NEWS_COLLECTOR_FN=stockara-news-collector" >> "$GITHUB_ENV"
          else
            echo "Unsupported deployment stage: $stage"
            exit 1
          fi
          bucket="$(aws cloudformation describe-stacks \
            --stack-name StockMonitoringFrontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
            --output text)"
          echo "ARTIFACT_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Build invocation payload
        shell: bash
        env:
          TICKERS_CSV: ${{ inputs.tickers_csv }}
          PROVIDER_BUDGET_JSON: ${{ inputs.provider_budget_json }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python - <<'PY' > news-payload.json
          import json
          import os
          import sys

          tickers = [
              ticker.strip().upper()
              for ticker in os.environ["TICKERS_CSV"].split(",")
              if ticker.strip()
          ]
          try:
              provider_budget = json.loads(os.environ["PROVIDER_BUDGET_JSON"] or "{}")
          except json.JSONDecodeError as exc:
              print(f"provider_budget_json is invalid JSON: {exc}", file=sys.stderr)
              raise SystemExit(1)
          if not isinstance(provider_budget, dict):
              print("provider_budget_json must be a JSON object.", file=sys.stderr)
              raise SystemExit(1)
          normalized_budget = {}
          for provider, value in provider_budget.items():
              try:
                  budget = int(value)
              except (TypeError, ValueError):
                  print(f"Provider budget for {provider!r} must be an integer.", file=sys.stderr)
                  raise SystemExit(1)
              if budget < 0:
                  print(f"Provider budget for {provider!r} must be non-negative.", file=sys.stderr)
                  raise SystemExit(1)
              normalized_budget[str(provider).strip().lower()] = budget
          payload = {
              "mode": "repair_news",
              "provider_budget": normalized_budget,
              "dry_run": os.environ["DRY_RUN"].lower() == "true",
          }
          if tickers:
              payload["tickers"] = tickers
          print(json.dumps(payload))
          PY
          cat news-payload.json

      - name: Invoke news collector
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$NEWS_COLLECTOR_FN" \
            --payload file://news-payload.json \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            news-response.json > news-invoke.json
          python -c "import base64, json; meta=json.load(open('news-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('news-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat news-response.json
          python -m json.tool news-response.json
          python - <<'PY'
          import json
          import sys

          payload = json.load(open("news-response.json"))
          if payload.get("statusCode") != 200:
              print(f"News collector failed with statusCode={payload.get('statusCode')}")
              sys.exit(1)
          body = payload.get("body", {})
          status = str(body.get("status", "")).lower()
          sources_available = int(body.get("sources_available", 0) or 0)
          if status in {"error", "failed"} or (
              sources_available == 0 and status != "dry_run"
          ):
              print(f"News collector failed: {body}")
              sys.exit(1)
          if status != "success":
              failed_sources = ", ".join(body.get("failed_sources") or [])
              suffix = f": {failed_sources}" if failed_sources else ""
              print(f"::warning::News collector completed with status={status}{suffix}")
          print(
              "News summary: "
              f"status={status} "
              f"articles_processed={body.get('articles_processed')} "
              f"sources_available={sources_available} "
              f"total_fetched={body.get('total_fetched')}"
          )
          PY

      - name: Validate news static artifact
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key news/latest.json >/dev/null
          aws s3 cp "s3://$ARTIFACT_BUCKET/news/latest.json" news-latest.json
          python -m json.tool news-latest.json >/dev/null
          python - <<'PY'
          import json

          payload = json.load(open("news-latest.json"))
          last_run = payload.get("last_run", {})
          print(
              "News artifact: "
              f"generated_at={payload.get('generated_at')} "
              f"recent_article_count={payload.get('recent_article_count')} "
              f"ticker_count_with_news={payload.get('ticker_count_with_news')} "
              f"last_run_status={last_run.get('status')}"
          )
          PY
