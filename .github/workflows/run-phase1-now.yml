name: Run Phase 1 Pipeline Now

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: "Deployment stage to run"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
      stock_max_tickers:
        description: "Maximum stock tickers per stock-collector invocation"
        required: true
        default: "5"
      stock_batch_count:
        description: "Number of short stock-collector invocations to run"
        required: true
        default: "3"
      historical_backfill:
        description: "Run resumable historical backfill using S3 archives"
        required: true
        default: false
        type: boolean
      historical_backfill_max_tickers:
        description: "Historical backfill tickers per invocation"
        required: true
        default: "1"
      historical_backfill_continue:
        description: "Let the stock collector asynchronously continue historical backfill"
        required: true
        default: false
        type: boolean
      earnings_max_tickers:
        description: "Maximum earnings tickers to collect in this run"
        required: true
        default: "50"
      dividend_max_tickers:
        description: "Maximum dividend tickers to collect in this run"
        required: true
        default: "50"
      sync_watchlist_metadata:
        description: "Sync deployed stock metadata from data/watchlist_seed.csv before collection"
        required: true
        default: false
        type: boolean
      publish_after_collection:
        description: "Run analyzer/publisher after collectors finish"
        required: true
        default: true
        type: boolean
      analysis_batch_size:
        description: "Number of shortlisted candidates to analyze per analyzer invocation"
        required: true
        default: "5"
      analysis_batch_count:
        description: "Number of analyzer batch invocations to run"
        required: true
        default: "10"

concurrency:
  group: run-phase1-now-${{ inputs.deployment_stage }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  run:
    name: Invoke deployed Phase 1 Lambdas
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          for value in "${{ inputs.stock_max_tickers }}" "${{ inputs.stock_batch_count }}" "${{ inputs.historical_backfill_max_tickers }}" "${{ inputs.earnings_max_tickers }}" "${{ inputs.dividend_max_tickers }}" "${{ inputs.analysis_batch_size }}" "${{ inputs.analysis_batch_count }}"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]] || [[ "$value" -lt 1 ]]; then
              echo "Batch counts and ticker limits must be positive integers."
              exit 1
            fi
          done

      - name: Check AWS OIDC role configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing GitHub secret AWS_ROLE_TO_ASSUME."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: stockara-run-phase1-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve function names
        shell: bash
        run: |
          stage="${{ inputs.deployment_stage }}"
          if [[ "$stage" == "prod" ]]; then
            echo "STOCK_COLLECTOR_FN=stockara-stock-collector" >> "$GITHUB_ENV"
            echo "NEWS_COLLECTOR_FN=stockara-news-collector" >> "$GITHUB_ENV"
            echo "EARNINGS_COLLECTOR_FN=stockara-earnings-collector" >> "$GITHUB_ENV"
            echo "DIVIDEND_COLLECTOR_FN=stockara-dividend-collector" >> "$GITHUB_ENV"
            echo "PUBLISHER_FN=stockara-phase1-analyzer-publisher" >> "$GITHUB_ENV"
            echo "WATCHLIST_SEED_FN=stockara-watchlist-seed" >> "$GITHUB_ENV"
          else
            echo "Unsupported deployment stage: $stage"
            exit 1
          fi

      - name: Sync watchlist static metadata
        if: ${{ inputs.sync_watchlist_metadata }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$WATCHLIST_SEED_FN" \
            --payload '{"mode":"sync_static_metadata"}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            watchlist-sync-response.json > watchlist-sync-invoke.json
          python -c "import base64, json; meta=json.load(open('watchlist-sync-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('watchlist-sync-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat watchlist-sync-response.json
          python -m json.tool watchlist-sync-response.json

      - name: Run historical stock backfill
        if: ${{ inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{"mode":"historical_backfill","max_tickers":%s,"continue_backfill":%s,"scan_all":true}' "${{ inputs.historical_backfill_max_tickers }}" "${{ inputs.historical_backfill_continue }}")"
          aws lambda invoke \
            --function-name "$STOCK_COLLECTOR_FN" \
            --payload "$payload" \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            historical-backfill-response.json > historical-backfill-invoke.json
          python -c "import base64, json; meta=json.load(open('historical-backfill-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('historical-backfill-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat historical-backfill-response.json
          python -m json.tool historical-backfill-response.json

      - name: Invoke stock collector
        if: ${{ !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          for batch_index in $(seq 0 $((${{ inputs.stock_batch_count }} - 1))); do
            echo "Invoking stock collector batch ${batch_index}"
            aws lambda invoke \
              --function-name "$STOCK_COLLECTOR_FN" \
              --payload '{"max_tickers":${{ inputs.stock_max_tickers }}}' \
              --log-type Tail \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              "stock-response-${batch_index}.json" > "stock-invoke-${batch_index}.json"
            python -c "import base64, json; meta=json.load(open('stock-invoke-${batch_index}.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
            python -c "import json, sys; meta=json.load(open('stock-invoke-${batch_index}.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
            cat "stock-response-${batch_index}.json"
            python -m json.tool "stock-response-${batch_index}.json"
          done

      - name: Invoke news collector
        if: ${{ !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$NEWS_COLLECTOR_FN" \
            --payload '{}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            news-response.json > news-invoke.json
          python -c "import base64, json; meta=json.load(open('news-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('news-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat news-response.json
          python -m json.tool news-response.json

      - name: Invoke earnings collector
        if: ${{ !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$EARNINGS_COLLECTOR_FN" \
            --payload '{"max_tickers":${{ inputs.earnings_max_tickers }}}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            earnings-response.json > earnings-invoke.json
          python -c "import base64, json; meta=json.load(open('earnings-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('earnings-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat earnings-response.json
          python -m json.tool earnings-response.json

      - name: Invoke dividend collector
        if: ${{ !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$DIVIDEND_COLLECTOR_FN" \
            --payload '{"max_tickers":${{ inputs.dividend_max_tickers }}}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            dividend-response.json > dividend-invoke.json
          python -c "import base64, json; meta=json.load(open('dividend-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('dividend-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat dividend-response.json
          python -m json.tool dividend-response.json

      - name: Score Phase 1 candidates
        if: ${{ inputs.publish_after_collection && !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$PUBLISHER_FN" \
            --payload '{"mode":"score"}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            score-response.json > score-invoke.json
          python -c "import base64, json; meta=json.load(open('score-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('score-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat score-response.json
          python -m json.tool score-response.json

      - name: Analyze Phase 1 candidate batches
        if: ${{ inputs.publish_after_collection && !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          for batch_index in $(seq 0 $((${{ inputs.analysis_batch_count }} - 1))); do
            echo "Analyzing batch ${batch_index}"
            payload="$(printf '{"mode":"analyze_batch","batch_index":%s,"batch_size":%s}' "$batch_index" "${{ inputs.analysis_batch_size }}")"
            aws lambda invoke \
              --function-name "$PUBLISHER_FN" \
              --payload "$payload" \
              --log-type Tail \
              --cli-read-timeout 900 \
              --cli-binary-format raw-in-base64-out \
              "analysis-response-${batch_index}.json" > "analysis-invoke-${batch_index}.json"
            python -c "import base64, json; meta=json.load(open('analysis-invoke-${batch_index}.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
            python -c "import json, sys; meta=json.load(open('analysis-invoke-${batch_index}.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
            cat "analysis-response-${batch_index}.json"
            python -m json.tool "analysis-response-${batch_index}.json"
          done

      - name: Publish Phase 1 artifacts
        if: ${{ inputs.publish_after_collection && !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$PUBLISHER_FN" \
            --payload '{"mode":"publish"}' \
            --log-type Tail \
            --cli-read-timeout 900 \
            --cli-binary-format raw-in-base64-out \
            publisher-response.json > publisher-invoke.json
          python -c "import base64, json; meta=json.load(open('publisher-invoke.json')); print(base64.b64decode(meta.get('LogResult','')).decode() if meta.get('LogResult') else '')"
          python -c "import json, sys; meta=json.load(open('publisher-invoke.json')); sys.exit(1 if meta.get('FunctionError') else 0)"
          cat publisher-response.json
          python -m json.tool publisher-response.json

      - name: Validate published static artifacts
        if: ${{ inputs.publish_after_collection && !inputs.historical_backfill }}
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks \
            --stack-name StockMonitoringFrontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
            --output text)"

          for key in top-picks/latest.json sell-alerts/latest.json; do
            aws s3api head-object --bucket "$bucket" --key "$key" >/dev/null
            aws s3 cp "s3://$bucket/$key" - | python -m json.tool >/dev/null
            echo "Validated s3://$bucket/$key"
          done

          aws s3 cp "s3://$bucket/top-picks/latest.json" top-picks-latest.json
          python - <<'PY'
          import json

          payload = json.load(open("top-picks-latest.json"))
          print(
              "Publication summary: "
              f"generated_at={payload.get('generated_at')} "
              f"candidate_count={payload.get('candidate_count')} "
              f"analyzed_count={payload.get('analyzed_count')} "
              f"top_picks={len(payload.get('top_picks', []))} "
              f"sell_alerts={len(payload.get('sell_alerts', []))}"
          )
          for warning in payload.get("data_warnings", []):
              print(f"Data warning: {warning}")
          PY
