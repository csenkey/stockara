analysis_strategy:
  id: analysis_strategy_current
  status: baseline
  parent: null
  git_commit: unknown
  created_at: 2026-07-07
  description: Placeholder manifest for the currently hardcoded Stockara analyzer behavior. Replace unknowns with code-derived details before the first backtest comparison run.
  owner: istvan

preselection:
  flow_version: current_hardcoded
  predicates:
    - active_watchlist_only
    - price_data_fresh
    - min_30d_ohlcv
  filters:
    - suppress_stale_or_under_supported_tickers
  scoring:
    version: current_hardcoded
    weights: {}
  limits:
    max_candidates_per_day: 100
    max_ai_analyzed_per_day: 30

evidence:
  required:
    - ohlcv_30d
  optional:
    - news_7d
    - earnings_context
    - dividend_context
  used_data_sources:
    ohlcv:
      - stooq
      - yahoo
    news:
      - newsapi
      - finnhub
    earnings:
      - alpha_vantage
      - yahoo
    dividends:
      - yahoo
      - alpha_vantage
  excluded_data_sources: []
  missing_evidence_behavior: current_hardcoded

recommendation_ai:
  enabled: true
  model: current_configured_model
  prompt_template: current_hardcoded
  prompt_inputs:
    - ohlcv_30d
    - technical_indicators
    - news_7d
    - missing_evidence_summary
  output_schema: current_hardcoded
  parameters:
    temperature: 0

review_ai:
  enabled: true
  model: current_configured_review_model
  prompt_template: current_hardcoded
  review_gate:
    require_for_public_buy_sell: true
    reject_if_missing_catalyst: true
    reject_if_stale_price_data: true
  parameters:
    temperature: 0

publication:
  suppress_stale_tickers: true
  suppress_under_supported_tickers: true
  suppress_review_rejected_buy_sell: true
  expose_partial_coverage: true

fallbacks:
  missing_news: current_hardcoded
  ai_recommendation_failure: suppress_ticker
  ai_review_failure: suppress_public_buy_sell

cost_limits:
  max_total_run_cost_usd: 50
  max_ai_recommendation_calls_per_day: 30
  max_ai_review_calls_per_day: 8
